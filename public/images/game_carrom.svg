<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="carromKingBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e140d"/>
      <stop offset="60%" stop-color="#100b07"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <linearGradient id="sheeshamFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54240d"/>
      <stop offset="40%" stop-color="#381807"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </linearGradient>
    <radialGradient id="birchPly" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fae7ca"/>
      <stop offset="65%" stop-color="#f0d3a7"/>
      <stop offset="100%" stop-color="#deb887"/>
    </radialGradient>
    <radialGradient id="rubyQueen" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="60%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#660012"/>
    </radialGradient>
    <radialGradient id="ivoryCoin" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4ecd8"/>
      <stop offset="100%" stop-color="#d3c2a3"/>
    </radialGradient>
    <radialGradient id="ebonyCoin" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3a3f47"/>
      <stop offset="60%" stop-color="#1a1d22"/>
      <stop offset="100%" stop-color="#08090a"/>
    </radialGradient>
    <radialGradient id="acrylicStriker" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </radialGradient>
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Velvet / Walnut Background -->
  <rect width="800" height="450" fill="url(#carromKingBg)"/>

  <!-- Decorative Background Ring -->
  <circle cx="480" cy="225" r="210" fill="none" stroke="rgba(212, 163, 115, 0.12)" stroke-width="2"/>

  <!-- Authentic Sheesham Wood Board Frame -->
  <g transform="translate(260, 25)">
    <!-- 3D Drop Shadow -->
    <rect x="22" y="22" width="480" height="380" rx="30" fill="rgba(0,0,0,0.7)"/>

    <!-- Outer Sheesham Rail -->
    <rect x="10" y="10" width="480" height="380" rx="30" fill="url(#sheeshamFrame)" stroke="#ffd700" stroke-width="2" filter="url(#royalGlow)"/>

    <!-- Inner Smooth Birch Plywood Playing Surface -->
    <rect x="34" y="34" width="432" height="332" rx="16" fill="url(#birchPly)"/>

    <!-- Board Corner Pockets -->
    <circle cx="58" cy="58" r="18" fill="#140b07" stroke="#331c11" stroke-width="3"/>
    <circle cx="442" cy="58" r="18" fill="#140b07" stroke="#331c11" stroke-width="3"/>
    <circle cx="58" cy="342" r="18" fill="#140b07" stroke="#331c11" stroke-width="3"/>
    <circle cx="442" cy="342" r="18" fill="#140b07" stroke="#331c11" stroke-width="3"/>

    <!-- Center Geometric Mandala Circles -->
    <circle cx="250" cy="200" r="55" fill="none" stroke="#a3331b" stroke-width="2.5"/>
    <circle cx="250" cy="200" r="18" fill="none" stroke="#a3331b" stroke-width="2"/>
    <circle cx="250" cy="200" r="5" fill="#a3331b"/>

    <!-- 4 Baseline Red Arrows & Circles -->
    <!-- Top Baseline -->
    <line x1="120" y1="88" x2="380" y2="88" stroke="#a3331b" stroke-width="2"/>
    <line x1="120" y1="94" x2="380" y2="94" stroke="#a3331b" stroke-width="1.2"/>
    <circle cx="120" cy="91" r="11" fill="#a3331b" fill-opacity="0.2" stroke="#a3331b" stroke-width="1.8"/>
    <circle cx="120" cy="91" r="6" fill="#a3331b"/>
    <circle cx="380" cy="91" r="11" fill="#a3331b" fill-opacity="0.2" stroke="#a3331b" stroke-width="1.8"/>
    <circle cx="380" cy="91" r="6" fill="#a3331b"/>

    <!-- Bottom Baseline -->
    <line x1="120" y1="306" x2="380" y2="306" stroke="#a3331b" stroke-width="2"/>
    <line x1="120" y1="312" x2="380" y2="312" stroke="#a3331b" stroke-width="1.2"/>
    <circle cx="120" cy="309" r="11" fill="#a3331b" fill-opacity="0.2" stroke="#a3331b" stroke-width="1.8"/>
    <circle cx="120" cy="309" r="6" fill="#a3331b"/>
    <circle cx="380" cy="309" r="11" fill="#a3331b" fill-opacity="0.2" stroke="#a3331b" stroke-width="1.8"/>
    <circle cx="380" cy="309" r="6" fill="#a3331b"/>

    <!-- Authentic Carrom Coins Pattern (Cluster in Center) -->
    <!-- Queen in Center -->
    <circle cx="250" cy="200" r="15" fill="url(#rubyQueen)" stroke="#ffe5ec" stroke-width="1.5" filter="url(#royalGlow)"/>
    <circle cx="250" cy="200" r="6" fill="#ffd700"/>

    <!-- Surrounding 6 Coins -->
    <circle cx="225" cy="186" r="14" fill="url(#ivoryCoin)" stroke="#665c49" stroke-width="1"/>
    <circle cx="250" cy="170" r="14" fill="url(#ebonyCoin)" stroke="#222" stroke-width="1"/>
    <circle cx="275" cy="186" r="14" fill="url(#ivoryCoin)" stroke="#665c49" stroke-width="1"/>
    <circle cx="275" cy="214" r="14" fill="url(#ebonyCoin)" stroke="#222" stroke-width="1"/>
    <circle cx="250" cy="230" r="14" fill="url(#ivoryCoin)" stroke="#665c49" stroke-width="1"/>
    <circle cx="225" cy="214" r="14" fill="url(#ebonyCoin)" stroke="#222" stroke-width="1"/>

    <!-- Outer Ring Coins -->
    <circle cx="205" cy="165" r="14" fill="url(#ebonyCoin)" stroke="#222" stroke-width="1"/>
    <circle cx="295" cy="165" r="14" fill="url(#ivoryCoin)" stroke="#665c49" stroke-width="1"/>
    <circle cx="295" cy="235" r="14" fill="url(#ebonyCoin)" stroke="#222" stroke-width="1"/>
    <circle cx="205" cy="235" r="14" fill="url(#ivoryCoin)" stroke="#665c49" stroke-width="1"/>

    <!-- Acrylic Striker with Aim Arrow -->
    <g transform="translate(190, 312)">
      <circle cx="0" cy="0" r="22" fill="url(#acrylicStriker)" stroke="#ffffff" stroke-width="2.5" filter="url(#royalGlow)"/>
      <circle cx="0" cy="0" r="8" fill="#ffd700"/>
      <!-- Trajectory Arrow pointing to Queen -->
      <line x1="0" y1="-24" x2="42" y2="-88" stroke="#ffd700" stroke-width="2.8" stroke-dasharray="6 4"/>
      <polygon points="42,-88 32,-80 38,-74" fill="#ffd700"/>
    </g>
  </g>

  <!-- Left Side Royal Title Block -->
  <g transform="translate(42, 60)">
    <!-- 300 FPS Chip -->
    <rect width="180" height="32" rx="16" fill="rgba(0, 255, 136, 0.15)" stroke="#00ff88" stroke-width="1.5"/>
    <path d="M 24,11 L 30,11 L 26,17 L 31,17 L 22,25 L 24,19 L 20,19 Z" fill="#00ff88"/>
    <text x="105" y="21" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#00ff88" text-anchor="middle" letter-spacing="2">300 FPS PHYSICS</text>

    <!-- Title Header -->
    <g transform="translate(0, 58)">
      <path d="M 0,16 L 4,2 L 12,9 L 20,-4 L 28,9 L 36,2 L 40,16 Z" fill="#ffd700" stroke="#fff" stroke-width="1.5"/>
      <circle cx="4" cy="2" r="2" fill="#fff"/>
      <circle cx="20" cy="-4" r="2.5" fill="#ffd700"/>
      <circle cx="36" cy="2" r="2" fill="#fff"/>
      <text x="48" y="16" font-family="'Cinzel', serif" font-weight="900" font-size="34" fill="#ffd700">CARROM</text>
    </g>
    <text x="0" y="118" font-family="'Outfit', sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="2">KING ROYALE</text>
    
    <text x="0" y="152" font-family="'Outfit', sans-serif" font-weight="600" font-size="14" fill="#d4a373">Classic Birchwood &#8226; Humanized AI</text>
  </g>
</svg>

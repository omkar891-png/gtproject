<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#050c18"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>

    <!-- Orb Gradients -->
    <radialGradient id="greenOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#55ff99"/>
      <stop offset="70%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#006633"/>
    </radialGradient>

    <radialGradient id="cyanOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#70f3ff"/>
      <stop offset="70%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#004d80"/>
    </radialGradient>

    <radialGradient id="magentaOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff66aa"/>
      <stop offset="70%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#660022"/>
    </radialGradient>

    <radialGradient id="goldOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffe866"/>
      <stop offset="70%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#996600"/>
    </radialGradient>

    <!-- Intense Glow Filters -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(0, 242, 254, 0.08)" stroke-width="1.5">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Perspective Arena Grid Rings -->
  <circle cx="600" cy="337" r="380" fill="none" stroke="rgba(0, 255, 136, 0.12)" stroke-width="2" stroke-dasharray="14 10"/>
  <circle cx="600" cy="337" r="260" fill="none" stroke="rgba(0, 242, 254, 0.18)" stroke-width="2.5"/>
  <circle cx="600" cy="337" r="140" fill="none" stroke="rgba(255, 0, 85, 0.25)" stroke-width="3" stroke-dasharray="20 12"/>

  <!-- Shockwave Energy Waves -->
  <ellipse cx="600" cy="337" rx="320" ry="110" fill="none" stroke="rgba(0, 255, 136, 0.45)" stroke-width="3" transform="rotate(-25 600 337)" filter="url(#softGlow)"/>
  <ellipse cx="600" cy="337" rx="320" ry="110" fill="none" stroke="rgba(255, 0, 85, 0.45)" stroke-width="3" transform="rotate(35 600 337)" filter="url(#softGlow)"/>
  <ellipse cx="600" cy="337" rx="340" ry="110" fill="none" stroke="rgba(0, 210, 255, 0.4)" stroke-width="3" transform="rotate(85 600 337)" filter="url(#softGlow)"/>

  <!-- Connecting Laser Energy Conduits -->
  <g stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" filter="url(#softGlow)">
    <line x1="600" y1="337" x2="420" y2="210"/>
    <line x1="600" y1="337" x2="780" y2="210"/>
    <line x1="600" y1="337" x2="350" y2="460"/>
    <line x1="600" y1="337" x2="850" y2="460"/>
  </g>

  <!-- Exploding Sub-Orbs / Cascading Cells -->
  <g filter="url(#superGlow)">
    <!-- Node 1: Green Unstable Cluster -->
    <circle cx="420" cy="210" r="32" fill="url(#greenOrb)"/>
    <circle cx="395" cy="235" r="22" fill="url(#greenOrb)"/>
    <circle cx="445" cy="235" r="22" fill="url(#greenOrb)"/>

    <!-- Node 2: Magenta Mega Cluster -->
    <circle cx="780" cy="210" r="36" fill="url(#magentaOrb)"/>
    <circle cx="815" cy="230" r="26" fill="url(#magentaOrb)"/>
    <circle cx="750" cy="240" r="24" fill="url(#magentaOrb)"/>

    <!-- Node 3: Cyan Orbiting Pair -->
    <circle cx="350" cy="460" r="34" fill="url(#cyanOrb)"/>
    <circle cx="385" cy="485" r="26" fill="url(#cyanOrb)"/>

    <!-- Node 4: Gold Critical detonator -->
    <circle cx="850" cy="460" r="38" fill="url(#goldOrb)"/>
    <circle cx="885" cy="435" r="26" fill="url(#goldOrb)"/>
  </g>

  <!-- Traveling Flying Particles -->
  <g filter="url(#superGlow)">
    <circle cx="510" cy="275" r="14" fill="#00ff88"/>
    <circle cx="690" cy="275" r="15" fill="#ff0055"/>
    <circle cx="480" cy="395" r="13" fill="#00d2ff"/>
    <circle cx="720" cy="395" r="15" fill="#ffd600"/>
    <circle cx="600" cy="180" r="16" fill="#00ff88"/>
    <circle cx="600" cy="495" r="17" fill="#ff0055"/>
  </g>

  <!-- Central Super-Critical Reaction Core -->
  <circle cx="600" cy="337" r="54" fill="url(#greenOrb)" filter="url(#superGlow)"/>
  <circle cx="565" cy="315" r="44" fill="url(#magentaOrb)" filter="url(#superGlow)"/>
  <circle cx="635" cy="315" r="44" fill="url(#cyanOrb)" filter="url(#superGlow)"/>
  <circle cx="600" cy="370" r="44" fill="url(#goldOrb)" filter="url(#superGlow)"/>
  <circle cx="600" cy="337" r="20" fill="#ffffff" filter="url(#superGlow)"/>

  <!-- Title Badge Overlay -->
  <g transform="translate(600, 585)">
    <rect x="-310" y="-38" width="620" height="66" rx="33" fill="rgba(6, 12, 24, 0.85)" stroke="#00ff88" stroke-width="2" filter="url(#softGlow)"/>
    <text x="0" y="7" text-anchor="middle" font-family="'Outfit', 'Rajdhani', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="4">
      CHAIN REACTION <tspan fill="#00ff88">HD</tspan>
    </text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2c170d"/>
      <stop offset="55%" stop-color="#150a05"/>
      <stop offset="100%" stop-color="#080302"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="80%" stop-color="#d48800"/>
      <stop offset="100%" stop-color="#996000"/>
    </linearGradient>

    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#542b17"/>
      <stop offset="50%" stop-color="#3b1b0d"/>
      <stop offset="100%" stop-color="#241007"/>
    </linearGradient>

    <!-- House Gradients -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#b31217"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33cc77"/>
      <stop offset="100%" stop-color="#006d33"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd84d"/>
      <stop offset="100%" stop-color="#c69200"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#004785"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Radial Sunburst Rays -->
  <g opacity="0.08" stroke="#ffd700" stroke-width="2">
    <line x1="400" y1="225" x2="0" y2="0"/>
    <line x1="400" y1="225" x2="200" y2="0"/>
    <line x1="400" y1="225" x2="400" y2="0"/>
    <line x1="400" y1="225" x2="600" y2="0"/>
    <line x1="400" y1="225" x2="800" y2="0"/>
    <line x1="400" y1="225" x2="800" y2="225"/>
    <line x1="400" y1="225" x2="800" y2="450"/>
    <line x1="400" y1="225" x2="400" y2="450"/>
    <line x1="400" y1="225" x2="0" y2="450"/>
    <line x1="400" y1="225" x2="0" y2="225"/>
  </g>

  <!-- Isometric/Perspective Ludo Board Container -->
  <g transform="translate(195, 35) scale(0.92)" filter="url(#dropShadow)">
    <!-- Wooden Board Border -->
    <rect x="20" y="10" width="420" height="420" rx="24" fill="url(#woodGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- White Tile Board Interior -->
    <rect x="36" y="26" width="388" height="388" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

    <!-- 4 Corner Yards -->
    <!-- Red Yard (Top Left) -->
    <rect x="42" y="32" width="150" height="150" rx="12" fill="url(#redGrad)"/>
    <circle cx="117" cy="107" r="54" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="95" cy="85" r="16" fill="url(#redGrad)"/>
    <circle cx="139" cy="85" r="16" fill="url(#redGrad)"/>
    <circle cx="95" cy="129" r="16" fill="url(#redGrad)"/>
    <circle cx="139" cy="129" r="16" fill="url(#redGrad)"/>

    <!-- Green Yard (Top Right) -->
    <rect x="268" y="32" width="150" height="150" rx="12" fill="url(#greenGrad)"/>
    <circle cx="343" cy="107" r="54" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="321" cy="85" r="16" fill="url(#greenGrad)"/>
    <circle cx="365" cy="85" r="16" fill="url(#greenGrad)"/>
    <circle cx="321" cy="129" r="16" fill="url(#greenGrad)"/>
    <circle cx="365" cy="129" r="16" fill="url(#greenGrad)"/>

    <!-- Blue Yard (Bottom Left) -->
    <rect x="42" y="258" width="150" height="150" rx="12" fill="url(#blueGrad)"/>
    <circle cx="117" cy="333" r="54" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="95" cy="311" r="16" fill="url(#blueGrad)"/>
    <circle cx="139" cy="311" r="16" fill="url(#blueGrad)"/>
    <circle cx="95" cy="355" r="16" fill="url(#blueGrad)"/>
    <circle cx="139" cy="355" r="16" fill="url(#blueGrad)"/>

    <!-- Yellow Yard (Bottom Right) -->
    <rect x="268" y="258" width="150" height="150" rx="12" fill="url(#yellowGrad)"/>
    <circle cx="343" cy="333" r="54" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="321" cy="311" r="16" fill="url(#yellowGrad)"/>
    <circle cx="365" cy="311" r="16" fill="url(#yellowGrad)"/>
    <circle cx="321" cy="355" r="16" fill="url(#yellowGrad)"/>
    <circle cx="365" cy="355" r="16" fill="url(#yellowGrad)"/>

    <!-- Center Home Triangles -->
    <polygon points="192,182 268,182 230,220" fill="url(#greenGrad)"/>
    <polygon points="268,182 268,258 230,220" fill="url(#yellowGrad)"/>
    <polygon points="268,258 192,258 230,220" fill="url(#blueGrad)"/>
    <polygon points="192,258 192,182 230,220" fill="url(#redGrad)"/>

    <!-- Golden Crown Center Core -->
    <circle cx="230" cy="220" r="22" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" filter="url(#goldGlow)"/>
    <path d="M 218,225 L 221,215 L 226,220 L 230,212 L 234,220 L 239,215 L 242,225 Z" fill="#ffffff" stroke="#996000" stroke-width="1.2"/>

    <!-- Red Home Column -->
    <rect x="68" y="208" width="124" height="24" fill="url(#redGrad)" rx="3"/>
    <!-- Green Home Column -->
    <rect x="218" y="58" width="24" height="124" fill="url(#greenGrad)" rx="3"/>
    <!-- Yellow Home Column -->
    <rect x="268" y="208" width="124" height="24" fill="url(#yellowGrad)" rx="3"/>
    <!-- Blue Home Column -->
    <rect x="218" y="258" width="24" height="124" fill="url(#blueGrad)" rx="3"/>
  </g>

  <!-- Giant Realistic 3D Ivory Dice with Red Center Pip -->
  <g transform="translate(635, 230) rotate(-14)" filter="url(#dropShadow)">
    <!-- Dice Body -->
    <rect x="-48" y="-48" width="96" height="96" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- 6 pips (Dots) -->
    <circle cx="-25" cy="-25" r="8" fill="#1e293b"/>
    <circle cx="-25" cy="0" r="8" fill="#1e293b"/>
    <circle cx="-25" cy="25" r="8" fill="#1e293b"/>
    <circle cx="25" cy="-25" r="8" fill="#1e293b"/>
    <circle cx="25" cy="0" r="8" fill="#1e293b"/>
    <circle cx="25" cy="25" r="8" fill="#1e293b"/>
  </g>

  <!-- Second 3D Dice (Showing Pip 1 with Red Center Dot) -->
  <g transform="translate(685, 340) rotate(16)" filter="url(#dropShadow)">
    <rect x="-35" y="-35" width="70" height="70" rx="15" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#e52521"/>
  </g>

  <!-- 3D Red Pawn Trophy on Left -->
  <g transform="translate(90, 230)" filter="url(#dropShadow)">
    <!-- Base -->
    <ellipse cx="0" cy="70" rx="35" ry="14" fill="rgba(0,0,0,0.5)"/>
    <path d="M -30,65 Q -25,20 -15,10 L 15,10 Q 25,20 30,65 Z" fill="url(#redGrad)" stroke="#a8110e" stroke-width="2"/>
    <!-- Collar Ring -->
    <ellipse cx="0" cy="10" rx="18" ry="6" fill="url(#goldGrad)"/>
    <!-- Head -->
    <circle cx="0" cy="-14" r="24" fill="url(#redGrad)" stroke="#a8110e" stroke-width="2"/>
    <circle cx="-7" cy="-20" r="6" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Title Badge & Crown Banner -->
  <g transform="translate(45, 55)">
    <rect width="190" height="34" rx="17" fill="rgba(255, 215, 0, 0.15)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="95" y="22" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#ffd700" text-anchor="middle" letter-spacing="2">2-4 PLAYERS &#8226; 3D DICE</text>
    
    <g transform="translate(0, 72)">
      <!-- Golden Vector Crown Icon -->
      <g transform="translate(16, -10)">
        <path d="M -14,14 L -18,-2 L -8,6 L 0,-10 L 8,6 L 18,-2 L 14,14 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="-18" cy="-2" r="2.5" fill="#ffffff"/>
        <circle cx="0" cy="-10" r="3" fill="#ffd700"/>
        <circle cx="18" cy="-2" r="2.5" fill="#ffffff"/>
      </g>
      <text x="44" y="2" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="38" fill="#ffffff">LUDO <tspan fill="url(#goldGrad)">KING ROYALE</tspan></text>
      <text x="46" y="26" font-family="'Outfit', sans-serif" font-weight="600" font-size="13" fill="#cbd5e1" letter-spacing="1">CLASSIC BOARD &#8226; 3D DICE &#8226; MULTIPLAYER</text>
    </g>
  </g>
</svg>

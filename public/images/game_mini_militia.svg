<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="mmBgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="45%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#03060f"/>
    </radialGradient>

    <!-- Jetpack Fire Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00f2fe"/>
      <stop offset="60%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="rgba(255, 109, 0, 0)"/>
    </linearGradient>

    <!-- Armor Gradient -->
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Visor Glow -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Battlefield -->
  <rect width="1200" height="675" fill="url(#mmBgGrad)"/>

  <!-- Distant Stars and Smoke Haze -->
  <g fill="rgba(255, 255, 255, 0.4)">
    <circle cx="120" cy="90" r="1.5"/>
    <circle cx="280" cy="160" r="2"/>
    <circle cx="450" cy="70" r="1"/>
    <circle cx="820" cy="110" r="2.5"/>
    <circle cx="1040" cy="80" r="1.5"/>
    <circle cx="950" cy="220" r="1.8"/>
    <circle cx="180" cy="310" r="2"/>
  </g>

  <!-- Floating Sci-Fi Combat Platforms -->
  <g>
    <!-- Left Platform -->
    <rect x="80" y="440" width="340" height="24" rx="6" fill="#1e293b" stroke="rgba(0, 242, 254, 0.5)" stroke-width="2"/>
    <line x1="80" y1="440" x2="420" y2="440" stroke="#00f2fe" stroke-width="3" filter="url(#laserGlow)"/>

    <!-- Right Floating Bridge -->
    <rect x="760" y="380" width="360" height="24" rx="6" fill="#1e293b" stroke="rgba(255, 0, 85, 0.5)" stroke-width="2"/>
    <line x1="760" y1="380" x2="1120" y2="380" stroke="#ff0055" stroke-width="3" filter="url(#laserGlow)"/>

    <!-- Central Low Deck -->
    <rect x="360" y="560" width="480" height="30" rx="6" fill="#0f172a" stroke="rgba(255, 214, 0, 0.4)" stroke-width="2"/>
    <line x1="360" y1="560" x2="840" y2="560" stroke="#ffd600" stroke-width="3" filter="url(#laserGlow)"/>
  </g>

  <!-- Laser Sights Across Screen -->
  <line x1="585" y1="262" x2="1180" y2="295" stroke="#ff0055" stroke-width="3.5" filter="url(#intenseGlow)"/>
  <circle cx="1180" cy="295" r="7" fill="#ff0055" filter="url(#intenseGlow)"/>

  <!-- Secondary Counter-Laser -->
  <line x1="980" y1="330" x2="570" y2="280" stroke="#00f2fe" stroke-width="2" stroke-dasharray="10 6" opacity="0.75" filter="url(#laserGlow)"/>

  <!-- Jetpack Exhaust Flame Plumes -->
  <g filter="url(#intenseGlow)">
    <polygon points="460,335 480,335 470,480" fill="url(#fireGrad)"/>
    <polygon points="488,335 508,335 498,460" fill="url(#fireGrad)"/>
    <ellipse cx="470" cy="340" rx="14" ry="8" fill="#ffffff"/>
    <ellipse cx="498" cy="340" rx="14" ry="8" fill="#ffffff"/>
  </g>

  <!-- Central Jetpack Combat Soldier -->
  <g transform="translate(430, 160)">
    <!-- Jetpack Thruster Units -->
    <rect x="25" y="105" width="22" height="65" rx="7" fill="#334155" stroke="#00f2fe" stroke-width="2"/>
    <rect x="55" y="105" width="22" height="65" rx="7" fill="#334155" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="36" cy="115" r="5" fill="#00f2fe" filter="url(#laserGlow)"/>
    <circle cx="66" cy="115" r="5" fill="#00f2fe" filter="url(#laserGlow)"/>

    <!-- Soldier Legs with Combat Boots -->
    <path d="M 45 170 L 35 225 L 55 230 L 62 175" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <path d="M 68 170 L 80 215 L 100 218 L 88 172" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>

    <!-- Torso Tactical Armor Plate -->
    <rect x="38" y="80" width="56" height="92" rx="14" fill="url(#armorGrad)" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Armor Detail Lines -->
    <line x1="44" y1="110" x2="88" y2="110" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2"/>
    <line x1="44" y1="135" x2="88" y2="135" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2"/>

    <!-- Helmet & Visor -->
    <ellipse cx="66" cy="50" rx="34" ry="36" fill="url(#armorGrad)" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 52 42 Q 78 36 94 48 Q 80 64 54 58 Z" fill="url(#visorGrad)" filter="url(#laserGlow)"/>

    <!-- Combat Weapon (Assault Rifle with Extended Barrel) -->
    <!-- Arms -->
    <path d="M 78 105 L 125 102 L 140 108" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <!-- Rifle Body -->
    <rect x="110" y="92" width="70" height="20" rx="4" fill="#0f172a" stroke="#ffd600" stroke-width="2"/>
    <rect x="180" y="96" width="45" height="10" rx="2" fill="#334155"/>
    <rect x="125" y="112" width="16" height="25" rx="3" fill="#1e293b"/> <!-- Magazine -->
    <!-- Muzzle Flash -->
    <circle cx="225" cy="101" r="16" fill="#ffd600" filter="url(#intenseGlow)"/>
    <circle cx="225" cy="101" r="7" fill="#ffffff"/>
  </g>

  <!-- Flying Muzzle & Explosion Sparks -->
  <g filter="url(#intenseGlow)">
    <circle cx="665" cy="262" r="5" fill="#ffd600"/>
    <circle cx="710" cy="255" r="3.5" fill="#ff6d00"/>
    <circle cx="740" cy="275" r="4.5" fill="#ffd600"/>
    <circle cx="830" cy="265" r="4" fill="#ffffff"/>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(600, 590)">
    <rect x="-310" y="-38" width="620" height="66" rx="33" fill="rgba(6, 12, 24, 0.85)" stroke="#00f2fe" stroke-width="2" filter="url(#laserGlow)"/>
    <text x="0" y="7" text-anchor="middle" font-family="'Outfit', 'Rajdhani', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="4">
      MINI MILITIA <tspan fill="#00f2fe">2D</tspan>
    </text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bombBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#140b20"/>
    </linearGradient>
    <linearGradient id="blastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffd600"/>
      <stop offset="70%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>
    <filter id="blastGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bombBg)"/>

  <!-- Cyber Grid Tiles -->
  <g opacity="0.15" stroke="#ff0055" stroke-width="1.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="750" y1="0" x2="750" y2="450"/>
  </g>

  <!-- Indestructible Cyber Pillars -->
  <g fill="#1e293b" stroke="#475569" stroke-width="2">
    <rect x="230" y="140" width="55" height="55" rx="8"/>
    <rect x="380" y="140" width="55" height="55" rx="8"/>
    <rect x="530" y="140" width="55" height="55" rx="8"/>
    <rect x="230" y="270" width="55" height="55" rx="8"/>
    <rect x="380" y="270" width="55" height="55" rx="8"/>
    <rect x="530" y="270" width="55" height="55" rx="8"/>
  </g>

  <!-- Destructible Glowing Power Crate -->
  <g transform="translate(300, 140)">
    <rect width="55" height="55" rx="8" fill="#ff9100" fill-opacity="0.25" stroke="#ff9100" stroke-width="2"/>
    <line x1="10" y1="10" x2="45" y2="45" stroke="#ff9100" stroke-width="2"/>
    <line x1="45" y1="10" x2="10" y2="45" stroke="#ff9100" stroke-width="2"/>
    <!-- Vector Bomb Icon -->
    <circle cx="27" cy="30" r="11" fill="#1e293b" stroke="#ff9100" stroke-width="1.5"/>
    <rect x="24" y="16" width="6" height="4" fill="#ffd600"/>
    <path d="M 27,16 Q 32,10 36,12" stroke="#ff0055" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Cross Laser Blast (Horizontal & Vertical Explosion Wave) -->
  <g filter="url(#blastGlow)">
    <!-- Horizontal Cross Beam -->
    <rect x="240" y="210" width="340" height="30" rx="15" fill="url(#blastGrad)"/>
    <!-- Vertical Cross Beam -->
    <rect x="395" y="60" width="30" height="330" rx="15" fill="url(#blastGrad)"/>
    <!-- Center Blast Core -->
    <circle cx="410" cy="225" r="40" fill="#ffffff"/>
    <circle cx="410" cy="225" r="24" fill="#ffd600"/>
    <circle cx="410" cy="225" r="12" fill="#ff0055"/>
  </g>

  <!-- Giant Active Cyber Bomb in Center Left -->
  <g transform="translate(180, 240)" filter="url(#blastGlow)">
    <!-- Bomb Body -->
    <circle cx="0" cy="0" r="48" fill="#0b0f19" stroke="#ff0055" stroke-width="3"/>
    <!-- Core Glow Ring -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#ffd600" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="0" y="8" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="24" fill="#ff0055" text-anchor="middle">0:01</text>
    <!-- Cap & Fuse -->
    <rect x="-12" y="-56" width="24" height="12" rx="4" fill="#334155"/>
    <path d="M 0,-56 Q 20,-80 32,-70" stroke="#ffd600" stroke-width="3.5" fill="none"/>
    <!-- Spark Star -->
    <circle cx="32" cy="-70" r="8" fill="#ffffff" filter="url(#blastGlow)"/>
    <circle cx="32" cy="-70" r="4" fill="#ff0055"/>
  </g>

  <!-- Hero Robot (Bomberman style with Cyber Helmet) -->
  <g transform="translate(620, 210)" filter="url(#blastGlow)">
    <!-- Body -->
    <circle cx="0" cy="15" r="26" fill="#00f2fe" stroke="#ffffff" stroke-width="2"/>
    <!-- Helmet / Head -->
    <circle cx="0" cy="-22" r="24" fill="#ffffff"/>
    <!-- Visor -->
    <rect x="-18" y="-30" width="36" height="15" rx="7" fill="#0b0f19" stroke="#00f2fe" stroke-width="1.5"/>
    <!-- Antenna -->
    <line x1="0" y1="-46" x2="0" y2="-62" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="0" cy="-65" r="6" fill="#ff0055"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 50)">
    <rect width="210" height="34" rx="17" fill="#ff0055" fill-opacity="0.15" stroke="#ff0055" stroke-width="1.5"/>
    <text x="105" y="22" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#ff0055" text-anchor="middle" letter-spacing="2">2-4 PLAYERS &#8226; BLAST ARENA</text>
    <text x="0" y="75" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="34" fill="#ffffff">CYBER <tspan fill="#ff0055">BOMB ARENA</tspan></text>
  </g>
</svg>
